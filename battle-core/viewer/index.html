<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>戰鬥核心試玩</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: tactical plot on the left, order-of-battle and orders column on the right, transport bar under the plot. */
:root {
  --bg: #0b1016;
  --panel: #111922;
  --line: #1f2b38;
  --grid: #16202b;
  --fg: #d7e1ea;
  --muted: #7d8c9b;
  --blue: #5aa9ff;
  --red: #ff6b5e;
  --beam: #8fe3ff;
  --kinetic: #ffd479;
  --missile: #ff9ff0;
  --rock: #6b6256;
  --nebula: #7a5cc4;
  --good: #6fd08c;
  --warn: #f2c14e;
  --bad: #ff6b5e;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-data: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.45 var(--font-body); }
.app { display: grid; grid-template-columns: minmax(0, 1fr) 320px; grid-template-rows: auto minmax(0, 1fr) auto; height: 100%; }
header { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
header h1 { font-size: 15px; font-weight: 700; margin: 0; letter-spacing: .02em; }
.clock { font-family: var(--font-data); font-variant-numeric: tabular-nums; display: flex; flex-wrap: wrap; gap: 4px 16px; color: var(--muted); }
.clock b { color: var(--fg); font-weight: 600; }
.cp { display: inline-flex; gap: 3px; vertical-align: -1px; }
.cp i { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--warn); }
.cp i.on { background: var(--warn); }
.load { margin-left: auto; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; color: var(--muted); }
.stage { position: relative; min-height: 0; }
canvas { display: block; width: 100%; height: 100%; }
#plot { cursor: crosshair; }
.legend { position: absolute; left: 12px; bottom: 10px; right: 12px; display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--muted); font-size: 12px; pointer-events: none; }
.legend i { display: inline-block; width: 14px; height: 2px; vertical-align: middle; margin-right: 5px; }
.legend i.box { height: 10px; width: 10px; opacity: .7; }
.banner { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--warn); color: var(--warn); padding: 6px 14px; border-radius: 4px; font-weight: 500; max-width: calc(100% - 32px); text-align: center; }
aside { grid-row: 2 / 4; grid-column: 2; border-left: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; overflow-y: auto; }
aside section { padding: 12px 14px; border-bottom: 1px solid var(--line); }
aside h2 { font-size: 11px; font-weight: 500; letter-spacing: .08em; color: var(--muted); margin: 0 0 8px; }
.groups { display: grid; gap: 6px; }
.grp { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; cursor: pointer; padding: 4px 6px; border-radius: 3px; border: 1px solid transparent; }
.grp:hover { background: var(--line); }
.grp.sel { border-color: var(--blue); background: var(--line); }
.grp.pick { border-color: var(--red); }
.grp .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.grp .st { font-size: 11px; color: var(--muted); font-family: var(--font-data); text-align: right; }
.grp .sig { grid-column: 1 / -1; font-size: 11px; color: var(--muted); }
.bar { grid-column: 1 / -1; height: 4px; background: var(--grid); border-radius: 2px; overflow: hidden; }
.bar > div { height: 100%; }
.orders .who { font-weight: 500; margin-bottom: 8px; }
.orders .btns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.orders .row3 { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.orders .row4 { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.orders .lbl { grid-column: 1 / -1; font-size: 11px; color: var(--muted); margin-top: 4px; }
.orders .msg { margin-top: 8px; min-height: 1.4em; color: var(--warn); }
.orders .hint { color: var(--muted); }
button, select, input[type=number] { font: inherit; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 4px 10px; cursor: pointer; }
input[type=number] { width: 80px; cursor: text; }
button:hover:not(:disabled), select:hover { border-color: var(--muted); }
button:disabled { opacity: .4; cursor: default; }
button.primary { background: var(--warn); color: #1a1405; border-color: var(--warn); font-weight: 700; }
button.armed { border-color: var(--red); color: var(--red); }
button .c { font-family: var(--font-data); font-size: 11px; color: var(--muted); margin-left: 4px; }
button.primary .c { color: inherit; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--blue); outline-offset: 1px; }
.log { padding: 8px 14px 14px; font-size: 12px; flex: 1 0 160px; }
.log div { padding: 2px 0; color: var(--muted); cursor: pointer; display: grid; grid-template-columns: 50px 1fr; gap: 6px; }
.log div.past { color: var(--fg); }
.log div .t { font-family: var(--font-data); font-variant-numeric: tabular-nums; color: var(--muted); }
.log div.hd { color: var(--warn); margin-top: 6px; }
.transport { grid-column: 1; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 10px 16px; border-top: 1px solid var(--line); }
.timeline { position: relative; flex: 1 1 240px; height: 28px; min-width: 0; }
.timeline canvas { cursor: pointer; }
label.chk { display: flex; align-items: center; gap: 5px; color: var(--muted); cursor: pointer; }
.report { font-size: 12px; }
.report table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.report td { padding: 2px 0; }
.report td:not(:first-child) { text-align: right; font-family: var(--font-data); }
.empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); text-align: center; padding: 16px; }
@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 62vh auto auto; height: auto; }
  aside { grid-row: auto; grid-column: 1; border-left: 0; border-top: 1px solid var(--line); overflow: visible; }
  .log { max-height: 280px; overflow-y: auto; }
}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>戰鬥核心試玩</h1>
    <div class="clock">
      <span>時間 <b id="t-sec">0.0</b> 秒</span>
      <span>脈衝 <b id="t-pulse">0</b></span>
      <span>藍 <b id="n-blue">0</b> 艘</span>
      <span>紅 <b id="n-red">0</b> 艘</span>
      <span id="cp-wrap" hidden>指令點 <span class="cp" id="cp"></span></span>
    </div>
    <div class="load">
      <span id="live-tools" hidden>
        <label for="seed">種子</label> <input id="seed" type="number" min="1" max="99999" value="1">
        <button id="restart" type="button">重新開戰</button>
        <label class="chk"><input id="aiBlue" type="checkbox">藍方也交給 AI</label>
      </span>
      <label for="file">載入重播檔</label>
      <input id="file" type="file" accept=".json,application/json">
    </div>
  </header>
  <div class="stage" id="stage">
    <canvas id="plot"></canvas>
    <div class="banner" id="banner" hidden></div>
    <div class="legend">
      <span><i style="background:var(--beam)"></i>光束</span>
      <span><i style="background:var(--kinetic)"></i>動能</span>
      <span><i style="background:var(--missile)"></i>飛彈、魚雷、戰機</span>
      <span><i class="box" style="background:var(--rock)"></i>小行星帶：減速、掩護</span>
      <span><i class="box" style="background:var(--nebula)"></i>星雲：1000 以外看不見、光束減半</span>
      <span>滾輪縮放，拖曳平移</span>
    </div>
    <div class="empty" id="empty">用 <code>battle --replay out.json</code> 產生重播檔，再從右上角載入。</div>
  </div>
  <aside>
    <section>
      <h2>戰鬥群（士氣）</h2>
      <div class="groups" id="groups"></div>
    </section>
    <section class="orders" id="orders" hidden></section>
    <section class="report" id="report" hidden></section>
    <div class="log" id="log"></div>
  </aside>
  <div class="transport">
    <span id="live-transport" hidden>
      <button id="go" class="primary" type="button">開打</button>
    </span>
    <span id="replay-transport">
      <button id="play" type="button">播放</button>
      <button id="back" type="button" title="上一幀">◀</button>
      <button id="fwd" type="button" title="下一幀">▶</button>
    </span>
    <select id="speed" aria-label="速度">
      <option value="1">1×</option>
      <option value="2" selected>2×</option>
      <option value="4">4×</option>
      <option value="8">8×</option>
    </select>
    <label class="chk" id="pp-wrap"><input id="pausePulse" type="checkbox" checked>每個脈衝暫停</label>
    <div class="timeline" id="tl-wrap"><canvas id="tl"></canvas></div>
  </div>
</div>
<script id="replay-data" type="application/json"></script>
<script id="wasm-data" type="application/octet-stream"></script>
<script>
(() => {
  const CLASS = [
    { name: "戰艦", len: 70, wid: 30 },
    { name: "巡洋艦", len: 50, wid: 20 },
    { name: "驅逐艦", len: 34, wid: 14 },
    { name: "旗艦", len: 95, wid: 42 },
    { name: "航艦", len: 80, wid: 38 },
  ];
  const SIG_OF_CLASS = [0, 1, 2, 0, 3];
  const SIG_NAME = ["主砲齊射", "魚雷齊射", "加力衝刺", "全機出擊"];
  const VERB = ["", "攻擊", "側擊", "固守", "推進", "集火部位", "換準則", "投入預備隊", "跳躍撤離", "招牌技"];
  const STATUS = ["交戰", "預備", "撤離中", "潰散", "已撤離", "全滅"];
  const DOCTRINE = ["砲列", "鐵砧", "鐵鎚"];
  const PART = { 1: "引擎", 2: "武器", 4: "護盾產生器", 8: "艦橋" };
  const ERR = {
    "-10": "沒有這個戰鬥群。", "-11": "那不是你的戰鬥群。", "-12": "這個戰鬥群已經退出戰鬥。",
    "-13": "指令點不夠。", "-14": "撤離中的戰鬥群不能再下令。", "-15": "它不在預備隊裡。",
    "-16": "目標必須是還在戰場上的敵方戰鬥群。", "-17": "戰鬥已經結束。", "-18": "招牌技還沒準備好。",
  };
  const EV = { FIRE: 1, LAUNCH: 2, INTERCEPT: 3, MHIT: 4, KILLED: 5, PART: 6, OVERLOAD: 7, ROUTED: 8, ESCAPED: 9, RETREAT: 10, COMMAND: 11, PULSE: 12, FLAGSHIP: 13, OVER: 14, SIG_CHARGE: 15, SIG_FIRE: 16, WING_LAUNCH: 17, FIGHTER_DOWN: 18, WING_STRIKE: 19, WING_LOST: 20 };

  const css = getComputedStyle(document.documentElement);
  const C = (n) => css.getPropertyValue("--" + n).trim();
  const COL = { side: [C("blue"), C("red")], dmg: [C("beam"), C("kinetic"), C("missile")], grid: C("grid"), line: C("line"), fg: C("fg"), muted: C("muted"), warn: C("warn"), good: C("good"), bad: C("bad"), rock: C("rock"), nebula: C("nebula"), bg: C("bg") };

  const $ = (id) => document.getElementById(id);
  const plot = $("plot"), ctx = plot.getContext("2d");
  const tl = $("tl"), tctx = tl.getContext("2d");

  // ---------------------------------------------------------------------
  // State shared by both modes
  // ---------------------------------------------------------------------
  let H = null;              // header: ships, groups, terrain, tickHz, pulseTicks
  let events = [];           // every event so far (replay: all of them)
  let fireByTick = new Map(), killByTick = new Map(), strikeByTick = new Map(), flashByTick = new Map();
  let view = { cx: 0, cy: 0, scale: 0.1 };
  let mode = "none";         // "replay" | "live"
  let report = null;
  let terrainCanvas = null;

  // replay
  let R = null, fi = 0, playing = false, lastT = 0, pausedAtPulse = -1;
  // live
  let W = null, bh = 0;      // wasm exports, battle handle
  let prev = null, cur = null, acc = 0, running = false, over = false;
  let sel = -1, pending = null, lastMsg = "";

  function resetEvents() {
    events = []; fireByTick = new Map(); killByTick = new Map(); strikeByTick = new Map(); flashByTick = new Map();
    $("log").innerHTML = ""; lastLogPulse = -1;
  }
  function addEvent(e) {
    events.push(e);
    const [t, k] = e;
    if (k === EV.FIRE || k === EV.INTERCEPT || k === EV.FIGHTER_DOWN) push(fireByTick, t, e);
    else if (k === EV.KILLED) push(killByTick, t, e);
    else if (k === EV.WING_STRIKE) push(strikeByTick, t, e);
    else if (k === EV.SIG_FIRE || k === EV.MHIT) push(flashByTick, t, e);
    logEvent(e);
  }
  function push(m, k, v) { let a = m.get(k); if (!a) m.set(k, a = []); a.push(v); }

  function setHeader(h) {
    H = h;
    H.sigs = H.groups.map(() => new Set());
    H.ships.forEach(([cls, , g]) => H.sigs[g].add(SIG_OF_CLASS[cls]));
    buildTerrain();
    buildGroups();
  }

  function fitView(frames) {
    let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
    for (const f of frames) for (const s of f.s) if (s) { x0 = Math.min(x0, s[0]); x1 = Math.max(x1, s[0]); y0 = Math.min(y0, s[1]); y1 = Math.max(y1, s[1]); }
    const r = plot.getBoundingClientRect();
    view.cx = (x0 + x1) / 2; view.cy = (y0 + y1) / 2;
    view.scale = Math.min(r.width / ((x1 - x0) * 1.2 + 1), r.height / ((y1 - y0) * 1.3 + 1));
  }

  // ---------------------------------------------------------------------
  // Terrain: painted once into an offscreen canvas in world units
  // ---------------------------------------------------------------------
  function buildTerrain() {
    const t = H.terrain;
    terrainCanvas = null;
    if (!t || !/[12]/.test(t.cells)) return;
    const px = 20; // pixels per cell
    const c = document.createElement("canvas");
    c.width = c.height = t.dim * px;
    const g = c.getContext("2d");
    let seed = 7;
    const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    for (let cy = 0; cy < t.dim; cy++) for (let cx = 0; cx < t.dim; cx++) {
      const k = t.cells[cy * t.dim + cx];
      const X = cx * px, Y = (t.dim - 1 - cy) * px; // world y up
      if (k === "2") {
        const grd = g.createRadialGradient(X + px / 2, Y + px / 2, 0, X + px / 2, Y + px / 2, px * 1.1);
        grd.addColorStop(0, hexA(COL.nebula, 0.2)); grd.addColorStop(1, hexA(COL.nebula, 0));
        g.fillStyle = grd; g.fillRect(X - px, Y - px, px * 3, px * 3);
      } else if (k === "1") {
        g.fillStyle = hexA(COL.rock, 0.16); g.fillRect(X, Y, px, px);
        g.fillStyle = hexA(COL.rock, 0.9);
        for (let i = 0; i < 4; i++) { g.beginPath(); g.arc(X + rnd() * px, Y + rnd() * px, 0.8 + rnd() * 2.2, 0, Math.PI * 2); g.fill(); }
      }
    }
    terrainCanvas = { canvas: c, px, dim: t.dim, cell: t.cell };
  }
  function hexA(hex, a) {
    const n = parseInt(hex.slice(1), 16);
    return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`;
  }

  // ---------------------------------------------------------------------
  // Side panel
  // ---------------------------------------------------------------------
  function buildGroups() {
    const el = $("groups");
    el.innerHTML = "";
    H.groups.forEach((g, i) => {
      const d = document.createElement("div");
      d.className = "grp";
      d.id = "grp" + i;
      const sig = [...H.sigs[i]].map(k => SIG_NAME[k]).join("＋");
      d.innerHTML = `<span class="nm" style="color:${COL.side[g.side]}">${esc(g.name)} <span style="color:var(--muted)" id="gd${i}"></span></span><span class="st" id="gs${i}"></span><div class="bar"><div id="gb${i}"></div></div><span class="sig" id="gg${i}" data-name="${esc(sig)}"></span>`;
      d.onclick = () => groupClicked(i);
      el.appendChild(d);
    });
  }
  function sigText(sig, armed) {
    if (armed) return "已下令，敵人進入射程就充能";
    if (sig < 0) return `充能中 ${(-sig / H.tickHz).toFixed(1)} 秒`;
    if (sig > 0) return `冷卻 ${Math.ceil(sig / H.tickHz)} 秒`;
    return "就緒";
  }
  function updateGroups(frame) {
    frame.g.forEach((g, i) => {
      const [, , , , coh, st, , alive, sig, armed, out, docked] = g;
      const air = out || docked ? ` · 戰機 出擊 ${out} / 機庫 ${docked}` : "";
      $("gs" + i).textContent = `${STATUS[st]} · ${alive} 艘 · ${coh}${air}`;
      const b = $("gb" + i);
      b.style.width = (coh / 10) + "%";
      b.style.background = coh > 600 ? COL.good : coh > 250 ? COL.warn : COL.bad;
      const gg = $("gg" + i);
      gg.textContent = st >= 3 ? "" : `${gg.dataset.name}：${sigText(sig ?? 0, armed)}`;
      $("gd" + i).textContent = DOCTRINE[H.groups[i].doctrineNow ?? H.groups[i].doctrine];
      const el = $("grp" + i);
      el.classList.toggle("sel", i === sel);
      el.classList.toggle("pick", !!pending && pending.needs === "enemy" && H.groups[i].side === 1 && st <= 2);
    });
  }

  let lastLogPulse = -1;
  function logEvent([t, k, a, b, c]) {
    let text = null, cls = "";
    const G = (i) => `<span style="color:${COL.side[H.groups[i].side]}">${esc(H.groups[i].name)}</span>`;
    if (k === EV.PULSE) { text = `脈衝 ${c} 開始`; cls = "hd"; }
    else if (k === EV.COMMAND && c !== 8 && c !== 9) text = `${G(a)} ${VERB[c]}`;
    else if (k === EV.ROUTED) text = `${G(a)} 潰散`;
    else if (k === EV.ESCAPED) text = `${G(a)} 撤離成功（${c} 艘）`;
    else if (k === EV.RETREAT) text = `${G(a)} 開始撤離，15 秒內不能開火`;
    else if (k === EV.SIG_CHARGE) text = `${G(a)} 招牌技充能（${(c / H.tickHz).toFixed(0)} 秒後發動）`;
    else if (k === EV.SIG_FIRE) text = `${G(a)} 發動 ${[...H.sigs[a]].map(s => SIG_NAME[s]).join("＋")}`;
    else if (k === EV.FLAGSHIP) text = `<span style="color:${COL.side[b]}">${b ? "紅" : "藍"}方旗艦</span> 被擊沉`;
    else if (k === EV.OVER) { text = c < 0 ? "平手" : `<span style="color:${COL.side[c]}">${c ? "紅" : "藍"}方勝</span>`; cls = "hd"; }
    if (!text) return;
    const d = document.createElement("div");
    d.className = cls + (mode === "live" ? " past" : "");
    d.dataset.t = t;
    d.innerHTML = `<span class="t">${(t / H.tickHz).toFixed(1)}s</span><span>${text}</span>`;
    if (mode === "replay") d.onclick = () => seekTick(t);
    $("log").appendChild(d);
    if (mode === "live") d.scrollIntoView({ block: "nearest" });
  }
  function updateLog(tick) {
    if (mode !== "replay") return;
    for (const d of $("log").children) d.classList.toggle("past", +d.dataset.t <= tick);
  }
  function showReport(r) {
    const el = $("report");
    if (!r) { el.hidden = true; return; }
    const row = (label, f) => `<tr><td>${label}</td><td style="color:${COL.side[0]}">${f(r.sides[0])}</td><td style="color:${COL.side[1]}">${f(r.sides[1])}</td></tr>`;
    const w = r.winner < 0 ? "平手" : `<span style="color:${COL.side[r.winner]}">${r.winner ? "紅" : "藍"}方勝</span>`;
    el.innerHTML = `<h2>戰報</h2><div style="margin-bottom:6px">${w}，${r.pulses} 個脈衝，${r.seconds} 秒</div><table>
      <tr><td></td><td style="color:var(--muted)">藍</td><td style="color:var(--muted)">紅</td></tr>
      ${row("被擊沉", s => `${s.lost}/${s.ships}`)}
      ${row("撤出", s => s.escaped)}
      ${row("損失價值", s => s.valueLost)}
      ${row("受光束傷害", s => s.damageTaken[0])}
      ${row("受動能傷害", s => s.damageTaken[1])}
      ${row("受飛彈、魚雷、戰機傷害", s => s.damageTaken[2])}</table>`;
    el.hidden = false;
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

  // ---------------------------------------------------------------------
  // Drawing
  // ---------------------------------------------------------------------
  function resize() {
    const dpr = window.devicePixelRatio || 1;
    for (const c of [plot, tl]) {
      const r = c.getBoundingClientRect();

    if (pending && pending.needs === "enemy") {
      if (H.groups[i].side === 1) return issue(pending.verb, i);
      pending = null;
    }
    if (H.groups[i].side === 0) { sel = i; pending = null; lastMsg = ""; }
    renderOrders(); render();
  }
  function nearestGroup(px, py) {
    const F = frames();
    if (!F) return -1;
    let best = -1, bd = 40 * 40;
    F[1].g.forEach((g, i) => {
      if (!g[7] || g[5] >= 3) return;
      const d = (sx(g[0]) - px) ** 2 + (sy(g[1]) - py) ** 2;
      if (d < bd) { bd = d; best = i; }
    });
    return best;
  }

  // ---------------------------------------------------------------------
  // Input
  // ---------------------------------------------------------------------
  function banner(text) { $("banner").hidden = !text; if (text) $("banner").textContent = text; }
  function setModeUI() {
    const live = mode === "live";
    $("live-tools").hidden = !W;
    $("live-transport").hidden = !live;
    $("replay-transport").hidden = live;
    $("pp-wrap").hidden = live;
    $("tl-wrap").style.visibility = live ? "hidden" : "visible";
    $("cp-wrap").hidden = !live;
    renderOrders();
  }

  $("play").onclick = () => setPlaying(!playing);
  $("back").onclick = () => { if (R) { setPlaying(false); fi = Math.max(0, Math.floor(fi) - 1); render(); } };
  $("fwd").onclick = () => { if (R) { setPlaying(false); fi = Math.min(R.frames.length - 1, Math.floor(fi) + 1); render(); } };
  $("go").onclick = go;
  $("restart").onclick = () => W && startLive();
  $("aiBlue").onchange = () => { if (mode === "live") startLive(); };
  document.addEventListener("keydown", (e) => {
    if (e.target.tagName === "INPUT" && e.target.type !== "checkbox") return;
    if (e.code === "Space") { e.preventDefault(); mode === "live" ? go() : setPlaying(!playing); }
    if (mode === "replay" && e.code === "ArrowRight") $("fwd").click();
    if (mode === "replay" && e.code === "ArrowLeft") $("back").click();
    if (e.code === "Escape" && pending) { pending = null; renderOrders(); render(); }
  });
  function scrub(e) {
    if (mode !== "replay") return;
    const r = tl.getBoundingClientRect();
    seekTick(Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * R.frames[R.frames.length - 1].t);
  }
  tl.addEventListener("pointerdown", (e) => { tl.setPointerCapture(e.pointerId); setPlaying(false); scrub(e); });
  tl.addEventListener("pointermove", (e) => { if (e.buttons) scrub(e); });

  let drag = null;
  plot.addEventListener("pointerdown", (e) => { plot.setPointerCapture(e.pointerId); drag = { x: e.clientX, y: e.clientY, cx: view.cx, cy: view.cy, moved: false }; });
  plot.addEventListener("pointermove", (e) => {
    const r = Wd();
    hover = [e.clientX - r.left, e.clientY - r.top];
    if (drag) {
      if (Math.abs(e.clientX - drag.x) + Math.abs(e.clientY - drag.y) > 5) drag.moved = true;
      if (drag.moved) { view.cx = drag.cx - (e.clientX - drag.x) / view.scale; view.cy = drag.cy + (e.clientY - drag.y) / view.scale; }
    }
    if (drag?.moved || (pending && pending.needs === "point")) render();
  });
  plot.addEventListener("pointerup", (e) => {
    const d = drag; drag = null;
    if (!d || d.moved || !H) return;
    const r = Wd();
    const px = e.clientX - r.left, py = e.clientY - r.top;
    if (mode === "live" && pending && pending.needs === "point") {
      const [wx, wy] = toWorld(px, py);
      return issue(4, Math.round(wx), Math.round(wy));
    }
    const g = nearestGroup(px, py);
    if (g >= 0) groupClicked(g);
  });
  plot.addEventListener("wheel", (e) => {
    e.preventDefault();
    const r = Wd();
    const [mx, my] = toWorld(e.clientX - r.left, e.clientY - r.top);
    view.scale *= Math.exp(-e.deltaY * 0.0015);
    view.cx = mx - (e.clientX - r.left - r.width / 2) / view.scale;
    view.cy = my + (e.clientY - r.top - r.height / 2) / view.scale;
    render();
  }, { passive: false });

  $("file").addEventListener("change", async (e) => {
    const f = e.target.files[0];
    if (!f) return;
    try { loadReplay(JSON.parse(await f.text())); }
    catch (err) { $("empty").hidden = false; $("empty").textContent = "無法讀取這個檔案：" + err.message + "。請選擇 battle --replay 產生的 JSON 檔。"; }
  });

  window.addEventListener("resize", resize);
  resize();

  (async () => {
    const wasm = $("wasm-data").textContent.trim();
    if (wasm) {
      try {
        const bytes = Uint8Array.from(atob(wasm), c => c.charCodeAt(0));
        W = (await WebAssembly.instantiate(bytes, {})).instance.exports;
        $("seed").value = 1 + Math.floor(Math.random() * 9999);
        startLive();
        return;
      } catch (err) {
        $("empty").textContent = "瀏覽器無法載入戰鬥核心：" + err.message;
      }
    }
    const embedded = $("replay-data").textContent.trim();
    if (embedded) loadReplay(JSON.parse(embedded));
    setModeUI();
  })();
})();
</script>
</body>
</html>
