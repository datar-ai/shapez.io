[package]
name = "battlecore"
version = "0.1.0"
edition = "2021"
description = "Headless deterministic fleet-battle simulation core (step 1 prototype)"

[lib]
name = "battlecore"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib", "staticlib"]

[[bin]]
name = "battle"
path = "src/bin/battle.rs"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

[[bin]]
name = "balance"
path = "src/bin/balance.rs"
